[package]
name = "xtask"
version = "0.1.0"
description = "Local-first CI and repo automation (PLAN.md §5): cargo xtask ci/shaders/assets/bench/capture/probe/dist"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# No [lints] workspace inheritance on purpose: xtask is a tool, and the
# error-handling policy (§2) permits unwrap/expect in tools (anyhow is still
# the style). It must remain clippy-clean under -D warnings like everything else.

[dependencies]
anyhow.workspace = true
# Spike 2 probe (§6 M0A) queries device capabilities directly; xtask sits
# outside the §3 containment seam and deny.toml's ash wrappers name it.
ash.workspace = true
sha2 = "0.11"
toml = "1"
# M2 (§4.4): the offline shader path compiles in-process through gg-shaders —
# the same compiler the hot path uses, and the only road to the reflection API.
gg-shaders = { path = "../crates/gg-shaders" }
# M4B (§5.6): the determinism gate's material — the curated replay and the
# chaos generator — is authored here and *checked* by an ordinary test in the
# demo, because the test has to run under qemu where xtask cannot. One source
# of truth, reached from both sides. Sim half only: no GPU, no winit.
demo-02-mesh = { path = "../demos/02-mesh", default-features = false, features = [
    "gate",
] }
gg-input = { path = "../crates/gg-input" }
# M5 (§5.6c): the curated demo-03 stream is authored here and driven through the
# real shell, so xtask needs the two constants the shell's replay header is
# built from — the tick rate and the Determinism Contract version. Nothing else
# from either crate is used; a mismatch would otherwise be a header nobody could
# check.
gg-core = { path = "../crates/gg-core" }
gg-math = { path = "../crates/gg-math" }
