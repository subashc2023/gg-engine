[package]
name = "xtask"
version = "0.1.0"
description = "Local-first CI and repo automation (PLAN.md §5): cargo xtask ci/shaders/assets/bench/capture/probe/dist"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# No [lints] workspace inheritance on purpose: xtask is a tool, and the
# error-handling policy (§2) permits unwrap/expect in tools (anyhow is still
# the style). It must remain clippy-clean under -D warnings like everything else.

[dependencies]
anyhow.workspace = true
# Spike 2 probe (§6 M0A) queries device capabilities directly; xtask sits
# outside the §3 containment seam and deny.toml's ash wrappers name it.
ash.workspace = true
sha2 = "0.11"
toml = "1"
# M2 (§4.4): the offline shader path compiles in-process through gg-shaders —
# the same compiler the hot path uses, and the only road to the reflection API.
gg-shaders = { path = "../crates/gg-shaders" }
# M9 (§4.6): same argument as gg-shaders above — `xtask assets` compiles through
# the asset compiler itself, so the gate cannot drift from the build.
ggc = { path = "../tools/ggc" }
# M4B (§5.6): the determinism gate's material — the curated replay and the
# chaos generator — is authored here and *checked* by an ordinary test in the
# demo, because the test has to run under qemu where xtask cannot. One source
# of truth, reached from both sides. Sim half only: no GPU, no winit.
demo-02-mesh = { path = "../demos/02-mesh", default-features = false, features = [
    "gate",
] }
gg-input = { path = "../crates/gg-input" }
# M14 (§6): `xtask reload --save` compares the *world* four tiers resumed to,
# which means opening their save files rather than diffing bytes — the container
# carries the writing dylib's content hash, so four tiers legitimately produce
# four different files holding one identical world.
gg-ecs = { path = "../crates/gg-ecs" }
# M13 (§6): demo 07's scripted UI session — the pointer path, the clicks and the
# settings changes they should produce — lives in the demo so the checked-in
# replay and the demo's own in-process test cannot drift. `default-features =
# false` drops the `game` feature: `gg_game!` exports fixed `extern "C"` names
# and this binary already links demo 02's.
demo-07-ui = { path = "../demos/07-ui", default-features = false }
# M14 (§6), same arrangement and the same reason: demo 08's scripted walk is the
# source of both the checked-in replay and the demo's own tests.
demo-08-save = { path = "../demos/08-save", default-features = false }
# M18 (§6): the recorded Tetris session. Unlike its neighbours this one keeps
# the `game` feature, because `session::hash_sequence` authors the checked-in
# baseline by driving the *declared* systems table — the same path the demo's
# own test and `gg-runtime` take, so one file stands behind the qemu leg and the
# three tier legs. That makes it the only `gg_game!` in this binary's graph, and
# a second one linked the same way would collide on its fixed extern names.
demo-10-tetris = { path = "../demos/10-tetris" }
# M20 (§6): the recorded platformer session — demo 10's arrangement, resolved
# around the collision its comment names: the `game` feature stays *off*, so no
# second set of `gg_game_*` symbols links here, and `session::Entry` takes the
# four exports out of the **built dylib** instead (libloading below) — the
# host's own road to the same declared tables (§4.2.2).
demo-11-platformer = { path = "../demos/11-platformer", default-features = false }
# M37 (§6): the recorded shooter session, demo 11's arrangement exactly — the
# `game` feature off, `session::Entry` taking the four exports out of the built
# dylib, for the same collision on the fixed `gg_game_*` names.
demo-12-shooter = { path = "../demos/12-shooter", default-features = false }
# M38 (§6): the recorded mission — the same arrangement again, and the reason it
# has to be is now a rule rather than a coincidence: one `gg_game!` per binary,
# and demo 10 already spent it.
demo-13-orbit = { path = "../demos/13-orbit", default-features = false }
# The loader for exactly that: `shell::platformer_entry` resolves demo 11's
# entry points from the artifact, the way `gg-runtime` does.
libloading.workspace = true
# M5 (§5.6c): the curated demo-03 stream is authored here and driven through the
# real shell, so xtask needs the two constants the shell's replay header is
# built from — the tick rate and the Determinism Contract version. Nothing else
# from either crate is used; a mismatch would otherwise be a header nobody could
# check.
# The editor's own session script and its verb-append rule (§6 M15). The gate
# authors demo 05's editor replay by *calling* both rather than restating them,
# so a panel that moved or a verb that changed moves the file with it.
gg-editor = { path = "../crates/gg-editor" }
gg-core = { path = "../crates/gg-core" }
gg-math = { path = "../crates/gg-math" }
