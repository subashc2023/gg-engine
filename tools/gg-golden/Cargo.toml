# gg-golden (§4.10) v0: offscreen render -> readback -> PNG -> compare, the
# minimal spine wired as a CI gate from the first triangle. Headless by
# linkage: no gg-platform, no winit — gate 7's symbol-absence check holds it.

[package]
name = "gg-golden"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
png.workspace = true
bytemuck.workspace = true
gg-rhi = { path = "../../crates/gg-rhi" }
gg-extract = { path = "../../crates/gg-extract" }
gg-math = { path = "../../crates/gg-math" }
demo-01-triangle = { path = "../../demos/01-triangle", default-features = false }
demo-02-mesh = { path = "../../demos/02-mesh", default-features = false, features = [
    "scene",
] }
