# gg-golden (§4.10) v0: offscreen render -> readback -> PNG -> compare, the
# minimal spine wired as a CI gate from the first triangle. Headless by
# linkage: no gg-platform, no winit — gate 7's symbol-absence check holds it.

[package]
name = "gg-golden"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
png.workspace = true
bytemuck.workspace = true
gg-rhi = { path = "../../crates/gg-rhi" }
# The render graph: the harness runs each scene's own declared passes and
# appends §4.5's readback pass to them.
gg-render = { path = "../../crates/gg-render" }
gg-extract = { path = "../../crates/gg-extract" }
# The v1 pass-list scenes declare their boxes the way a game does: two ordinary
# components in a World, read through the same typed query the shell uses.
gg-ecs = { path = "../../crates/gg-ecs" }
gg-math = { path = "../../crates/gg-math" }
demo-01-triangle = { path = "../../demos/01-triangle", default-features = false }
# `gate` as well as `scene`: it carries the curated replay §4.10's replay-driven
# scene is played back from. Still no `app`, so the graph stays winit-free.
demo-02-mesh = { path = "../../demos/02-mesh", default-features = false, features = [
    "scene",
    "gate",
] }
gg-input = { path = "../../crates/gg-input" }
# The capture trigger (§4.8). `gg-debug` is winit-free by its own dependency
# list, so `capture` reaches this binary without touching gate 7's linkage
# claim — which is the point: RenderDoc's own hotkey needs a Present, and
# nothing here presents.
gg-debug = { path = "../../crates/gg-debug" }
