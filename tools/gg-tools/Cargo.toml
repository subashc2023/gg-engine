# gg-tools: the instruments (CLAUDE.md, "Build the tool instead of doing it by
# hand"). One binary, subcommands, grown from whatever question got asked twice.
# It answers and reports; it never gates — a measurement that hardens into a
# threshold moves to `xtask` and the microscope stays here.
#
# Headless and windowless by linkage (§1.5): no gg-platform, no winit. Out of
# the shipping graph because nothing depends on it.

[package]
name = "gg-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tracing-subscriber.workspace = true
# Offscreen render → readback, the same surface `gg-golden` measures through.
# It also re-exports the knobs a sweep turns (§4.8) — reached through
# `gg_render::cvars` off the statics, never registered, because nothing here
# parses a config file — `gg-core` is below for its clock, never for that.
# `gpu-timings` because `cull` reports the *shadow passes'* own device time:
# the frame is mostly the forward pass on any rasterizer, so a frame-level
# number would report a 16% change as a 4% one and hide where it came from.
gg-render = { path = "../../crates/gg-render", features = ["gpu-timings"] }
gg-extract = { path = "../../crates/gg-extract" }
# The instrument's scenes declare geometry the way a game does: ordinary
# components in a World, read through the same typed query the shell uses.
gg-ecs = { path = "../../crates/gg-ecs" }
gg-math = { path = "../../crates/gg-math" }
# §6 M43's grading. `gg-audio` because the reach column has to be what the
# *shipped* mixer can produce — a model of it here would answer the question
# about this file instead; `gg-assets` because the loss column goes through the
# blob a pack actually holds. (`ggc` is already below, for M34's integral, and
# is what keeps the loss column measuring the real bake rather than a second
# decoder that happens to agree with it.)
gg-audio = { path = "../../crates/gg-audio" }
gg-assets = { path = "../../crates/gg-assets" }

# `hash-scale` declares its own components rather than borrowing the boundary's:
# its spread axis needs *zero-sized* markers, so archetype count moves without
# the byte count moving with it, and a component must be `Pod` to exist at all
# (§4.2). One derive macro, no budget — `xtask::budgets` prices the shipping
# crates and an instrument is not one.
bytemuck = { workspace = true }
# `pace` drives the two clocks the shell drives — the tick accumulator and the
# input one — rather than modelling them, which is the only way a number it
# prints is a number `gg-runtime` would have produced.
gg-core = { path = "../../crates/gg-core" }
gg-input = { path = "../../crates/gg-input" }
# `cull`'s subject is demo 05's field — ten thousand instances of three meshes,
# which is the pack pass's batching at its most extreme. Taken as a crate rather
# than reproduced here so the scene the instrument measures is the scene the
# demo renders; `default-features = false` keeps the game ABI's exports out of
# this binary, the way `gg-golden` takes it.
demo-05-many = { path = "../../demos/05-many", default-features = false }
# `ao`'s first question is whether a scene has any occlusion worth a pass, and
# that is a property of content rather than of the renderer. Demo 12's room is a
# table of axis-aligned boxes — shipped geometry that `gg_render::ao` represents
# exactly, so the reference casts against the level rather than against a guess.
demo-12-shooter = { path = "../../demos/12-shooter", default-features = false }
# `icon` draws demo 10's picture out of demo 10's own `SHAPES` and `COLORS`, so
# the taskbar and the well are the same palette by construction rather than by
# somebody having matched them once. `timbre` already takes this crate for the
# same reason a medium over.
demo-10-tetris = { path = "../../demos/10-tetris", default-features = false }
# `transfer` measures demo 13's own mission, so it drives demo 13's own pilot —
# `session::fly` through the declared systems table. Taken as a crate for the
# reason `cull` takes demo 05: a number about a mission has to come from the
# mission, not from a model of it.
# ...and with the game feature *on*, unlike the two above: `transfer` drives the
# declared systems table through `session::fly`, which needs the four `gg_game!`
# exports. Only one demo in this binary may have them, which is what keeps the
# other two at `default-features = false`.
demo-13-orbit = { path = "../../demos/13-orbit" }
# `Node` parenting is the scene graph's to resolve, and `cull`'s field is
# parented — extract reads world transforms, it does not compute them.
gg-scene = { path = "../../crates/gg-scene" }
# `furnace`'s lobe table grades one chain tap against the integral the chain
# approximates (§6 M33), and `ggc` is where that integral lives — taken as a
# library rather than reimplemented, because a reference written twice is two
# things that can be wrong instead of one. It is a *compiler*, so this is the one
# dependency here on the asset pipeline; `xtask dist` keeps both out of what
# ships, and an instrument is not the runtime.
ggc = { path = "../ggc" }
# Reading the `.hdr` that table integrates — the same decoder `ggc::import`
# uses, so the texels are the ones the pack was built from.
image = { version = "0.25", default-features = false, features = ["hdr"] }
# An instrument reports by writing an image under `target/gg-tools/`; it never
# opens a viewer (§1.5).
png.workspace = true
# `mcp`'s wire format (§6 M16). JSON is the protocol an external client speaks,
# not a format we chose, and hand-rolling a parser for someone else's protocol is
# the wrong place to save a dependency. §2's "the runtime never parses JSON" is
# untouched: `xtask dist` bans this crate from the shipping graph by name, and an
# instrument is not the runtime.
serde_json = "1"
