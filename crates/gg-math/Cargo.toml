# gg-math (§3, §4.2.1): gg_math::sim (ours, scalar, f32+f64, libm) and
# gg_math::render (glam) — two modules, no escape hatch between them. The glam
# dependency is legal here alone plus gg-extract (deny.toml wrappers). Not a
# general-purpose math library (§9): the API grows only with a named consumer.

[package]
name = "gg-math"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "gg_math"

[dependencies]
libm = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }

[lints]
workspace = true
