[package]
name = "gg-runtime"
version = "0.1.0"
description = "THE host shell — the one executable game code ever runs under, in every tier (PLAN.md §2/§3)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The loop skeleton and the reload host (§4.1, §4.2.2). Wired here, never
# implemented here — the shell's whole job is choosing which stages exist.
gg-core = { path = "../gg-core" }
# The world the game dylib is driven against, and the host half of the §4.2.2
# seam (the vtable, the component adoption, the systems driver) — all of which
# need `World`, which is why they are `gg-ecs`'s and not this crate's.
gg-ecs = { path = "../gg-ecs" }
# The window, the GPU, the one pass, and the narrowing between the sim and it.
# §2 gives the shell the renderer in every tier; §3 forbids it from *being* one,
# which is why `gg-render` exists and this is a dependency rather than a module.
gg-platform = { path = "../gg-platform" }
gg-render = { path = "../gg-render" }
gg-extract = { path = "../gg-extract" }
# §4.7's hierarchy. A dependency rather than a module for the same reason
# `gg-render` is one: the shell takes delivery of stages, it does not host them.
gg-scene = { path = "../gg-scene" }
# Action maps and the replay recorder — the recorder is unconditional in every
# tier (§2, Build tiers row), which is why it is not behind a feature.
gg-input = { path = "../gg-input" }
# The replay header's determinism contract, and the default eye's position.
gg-math = { path = "../gg-math" }
# The instruments (§4.8), and optional because §3 keeps them out of the dist
# graph entirely — which is why the observability init below has two shapes and
# not a feature flag inside one.
gg-debug = { path = "../gg-debug", optional = true }
# The UI layer (§4.9). Unconditional since M13, and that is the tier argument
# rather than a convenience: a game's HUD and menus are declared as `Widget`
# components and read by `gg_ui::Ui`, so a dist build without this crate would
# ship a game whose UI silently does not exist. The *overlay* stays lab
# equipment — that is `gg-debug` below, which is what the absence checks name.
gg-ui = { path = "../gg-ui" }
# Audio (§6 M18 item 2). Unconditional for the same reason `gg-ui` is: a game
# declares `Sound` components and a shell without this crate would ship a game
# that is silent with no way to tell. Not lab equipment — an automated tier gets
# a silent run out of `GG_HEADLESS`, not out of a missing dependency, so the code
# that opens a device is the code the dist gate builds.
gg-audio = { path = "../gg-audio" }
# The editor (§6 M15). Lab equipment like `gg-debug`: optional here, banned from
# the dist graph in `deny.toml`, and absent from `tier-dist` and
# `tier-dist-verify` — the latter deliberately, because dist-verify exists to be
# dist's codegen with a hash bolted on and a whole extra crate would stop it
# being that.
gg-editor = { path = "../gg-editor", optional = true }
anyhow.workspace = true
tracing.workspace = true
# The dist subscriber. In every other tier `gg-debug` installs a richer one, but
# a shipped build still logs, so this is not optional.
tracing-subscriber.workspace = true

[features]
default = ["tier-dev"]

# Individual features: few, strictly additive, never built in arbitrary
# combination — CI builds the four named tier combinations and nothing else
# (§3). Most are declared ahead of their machinery (§6 M0A: forty features
# retrofitted into a tier system later is the archaeology this prevents).
validation = ["gg-render/validation"]
tracy = ["debug-tools", "gg-debug/tracy"]
# The instruments crate itself, which the three lab features below all need.
# Named separately so `cfg(feature = "debug-tools")` is the one question the
# shell asks — "is gg-debug linked" — rather than a disjunction it must keep in
# step with the tier list.
debug-tools = ["dep:gg-debug"]
# Per-pass GPU timestamps (§4.8) — what the overlay's milliseconds and Tracy's
# GPU zones are both read from, so it rides with either.
gpu-timings = ["gg-render/gpu-timings"]
state-hash = []
nan-scan = []
# Forwarded rather than local: the machinery is `gg-core`'s and the tier
# meta-features below are the only place that decides it is present.
fp-assert = ["gg-core/fp-assert"]
hot-reload = ["gg-core/hot-reload", "gg-render/hot-reload"]
cvar-console = ["debug-tools"]
overlay = ["debug-tools"]
# The editor. Not implied by `debug-tools`: it is its own crate and its own
# absence proof, and a tier wanting instruments does not thereby want an editor.
editor = ["dep:gg-editor"]

# Tier meta-features (§2 Build tiers row, §3).
# `tracy` is deliberately **not** here, though `tier-instrumented` keeps it.
# `tracy-client` opens a TCP listener from a static constructor, so every binary
# that links `gg-debug` binds a socket before `main` — and feature unification
# put that in 63 of them, including `xtask` and every test binary in the
# workspace. On Windows that is a firewall prompt per executable *path*, and
# nextest names test binaries with a build hash, so every rebuild asked again.
# A port-keyed firewall rule does not suppress it: the prompt is raised per
# application, not per port (§6 M9's residual, measured twice).
#
# What this costs is nothing that was being read. Tracy is a tool someone
# attaches on purpose: `xtask run --tracy` puts it back for a play session,
# `tier-instrumented` has it for `xtask bench --record`, and Tracy's own GPU
# path keeps its dedicated `-p gg-debug --features tracy` leg in the nightly
# tier. What it buys is that a normal build listens on nothing at all.
tier-dev = [
    "validation",
    "gpu-timings",
    "state-hash",
    "nan-scan",
    "fp-assert",
    "hot-reload",
    "cvar-console",
    "overlay",
    "editor",
]
tier-instrumented = ["tracy", "gpu-timings", "state-hash", "editor"]
tier-dist = []                      # input recorder is unconditional, never a feature (§2)
tier-dist-verify = ["state-hash"]   # dist codegen + the hash, CI-only, gates §5.6c
