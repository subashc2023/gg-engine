# gg-platform (§3): the winit wrapper — window and (from M-input onward) raw
# input. The only place windows are born, which is where §1.5's headless law
# lives: under GG_HEADLESS=1 a visible-window request is a panic, not a window.

[package]
name = "gg-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
winit = { workspace = true }
raw-window-handle = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The §1.5 off-screen regression test reads the window handle back.
raw-window-handle = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# ...and asserts Win32 styles/geometry directly against the OS.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
# ...and asserts X11 geometry directly against the X server (WSLg leg).
x11rb = "0.13"
