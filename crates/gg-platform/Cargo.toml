# gg-platform (§3): the winit wrapper — window and (from M-input onward) raw
# input. The only place windows are born, which is where §1.5's headless law
# lives: under GG_HEADLESS=1 a visible-window request is a panic, not a window.

[package]
name = "gg-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
winit = { workspace = true }
raw-window-handle = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
