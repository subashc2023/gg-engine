# gg-rhi (§4.3): the only crate that speaks raw Vulkan — deny.toml bans `ash`
# elsewhere and the §3 grep rejects vk::/ash:: tokens outside this crate.
# Complexity budget (§3): no backend abstraction, no render concepts (meshes,
# materials), resource newtypes only. The public API is engine-shaped, not
# Vulkan-shaped in disguise — review holds that line, no grep can (§8).

[package]
name = "gg-rhi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
ash = { workspace = true }
ash-window = { workspace = true }
gpu-allocator = { workspace = true }
raw-window-handle = { workspace = true }
# `IndirectCommand` is `Pod` so a caller can hand a whole draw list to
# `write_buffer` as bytes (§6 M10). No new crate in any graph: `gg-ecs` already
# requires bytemuck of every component, so it ships everywhere this does.
bytemuck.workspace = true

[dev-dependencies]
gg-platform = { path = "../gg-platform" }
# Offscreen tests compile their fixture shaders in-process (same layer, §3).
gg-shaders = { path = "../gg-shaders" }
tracing-subscriber.workspace = true

[features]
# Default-on so every local build and test runs validated; tier-dist resolves
# this crate with default-features off (§2 Build tiers row). `validation`
# carries the layer + sync validation, the debug messenger, the suppressions
# mechanism, and debug_utils object names — all lab equipment (§1.13).
default = ["validation", "gpu-timings"]
validation = []
# Per-pass timestamps (§4.8): the query pool, the readback, and the per-frame
# pass names. Off in dist, where `Timings::new` folds to `None` and the rest
# goes with it.
gpu-timings = []
# The allocation-failure seam (§6 M85). In no tier and off by default — the one
# build that has it is `cargo nextest run -p gg-rhi --features inject`, which is
# what `tests/injected.rs` is `cfg`'d on. Not a dev-dependency because cargo has
# no such thing for features, and not default-on because a counter in the one
# function every byte passes through is not something to ship on a maybe.
inject = []
