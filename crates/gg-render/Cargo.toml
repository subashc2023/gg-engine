# gg-render (§3, §4.5) — passes and frame orchestration.
#
# **v0, and deliberately not the graph.** §4.5's v1 list opens with "forward
# opaque pass"; this crate is that one pass and nothing else, born at M5 because
# §2 gives the shell the renderer in every tier and §3 forbids the shell from
# *implementing* one. M6 replaces the inside with virtual resources and derived
# barriers; the shell's three calls are meant to survive it.

[package]
name = "gg-render"
version = "0.1.0"
description = "Render passes and frame orchestration (PLAN.md §4.5)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The GPU. `gg-render` speaks the RHI's safe API only — `ash`/`vk::` are banned
# outside gg-rhi by cargo-deny and by a grep gate (§3).
gg-rhi = { path = "../gg-rhi", default-features = false }
# The CVar registry only (§4.8). Downhill by §3's ordering, and the reason the
# registry is homed in `gg-core` rather than in the observability crate.
gg-core = { path = "../gg-core" }
# What a frame draws, already narrowed through the §1.4 membrane.
gg-extract = { path = "../gg-extract" }
# Pack assets and their load states. A downhill edge: `gg-assets` knows nothing
# about a GPU, and `residency` is the one place the two meet (§4.6).
gg-assets = { path = "../gg-assets" }
# The render half only: this crate is downstream of the membrane and has no
# business with sim types.
gg-math = { path = "../gg-math" }
bytemuck.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The window is the shell's; this crate only needs the handles a surface is
# built from, which is what keeps `gg-platform` out of its graph.
raw-window-handle = { workspace = true }
# The in-process Slang compiler, for the dev tier's shader hot reload only
# (§4.4): optional, pulled in by `hot-reload` and by nothing else, so the dist
# gate's `gg-shaders`/`shader-slang`/`notify` bans keep proving absence.
gg-shaders = { path = "../gg-shaders", features = ["hot-reload"], optional = true }

[features]
validation = ["gg-rhi/validation"]
# Forwarded, not local: the query pool is the RHI's and the tier meta-features
# in `gg-runtime` are the only place that decides it exists (§4.8).
gpu-timings = ["gg-rhi/gpu-timings"]
# The CPU half of the same picture (§6 M25). Forwarded for `gpu-timings`'
# reason: the collector is `gg-core`'s so a crate declaring a zone does not
# point a new dependency arrow at the instruments.
cpu-timings = ["gg-core/cpu-timings"]
# The two dev-tier reload paths this crate owns: notice a rebuilt pack and
# re-upload it (§4.6 — a `stat` and a re-open, gating the call), and recompile
# an edited `shaders/*.slang` in-process and rebuild its pipelines behind the
# timeline (§4.4 — this is the half that costs a dependency).
hot-reload = ["dep:gg-shaders"]

[dev-dependencies]
# The offscreen render test builds its world out of the render protocol's own
# components, so the path it proves is the one the shell runs (§1.5: no window).
gg-ecs = { path = "../gg-ecs" }
