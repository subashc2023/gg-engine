# gg-scene (§3, §4.7): the transform hierarchy — parent-relative local
# transforms in, world transforms written back into the render protocol.
#
# Determinism-critical: it writes state the canonical hash covers, so it takes
# the sim half of gg-math and nothing else. No `rayon` — an exemption would
# have to be earned in determinism-allowlist.toml first, by measurement.

[package]
name = "gg-scene"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gg-ecs = { path = "../gg-ecs" }
gg-math = { path = "../gg-math" }
thiserror.workspace = true

[dev-dependencies]
bytemuck.workspace = true
