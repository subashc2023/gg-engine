# gg-extract (§3, §4.1): the extract stage — sim world in, flat per-frame
# render arrays out.
#
# The one crate allowed both gg_math::sim and gg_math::render. That is its
# entire reason to exist: §1.4's membrane becomes a crate boundary instead of a
# lint exemption punched into a determinism-critical crate. One-way-ness is a
# dependency-direction fact — nothing sim-side depends on this.

[package]
name = "gg-extract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gg-ecs = { path = "../gg-ecs" }
gg-math = { path = "../gg-math" }

[dev-dependencies]
bytemuck.workspace = true
