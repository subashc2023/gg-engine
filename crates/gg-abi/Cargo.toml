# gg-abi (§3, §4.2.2) — the reload boundary, alone.
#
# The leaf crate every game dylib links, and the reason the seam's compatibility
# story is a version number governing a layout the language actually defines
# rather than a probabilistic claim about repr(Rust). Nothing here has
# behaviour: types, layout, symbol names, and one integer saying which boundary
# this is.
#
# `no_std` is the charter as a machine rather than a promise — a crate that
# cannot allocate cannot grow a subsystem. `bytemuck` is the sole dependency
# because `Entity` travels inside component bytes and must be `Pod` at its
# definition site: the orphan rule puts that impl here, not in gg-ecs.

[package]
name = "gg-abi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "gg_abi"

[dependencies]
bytemuck = { workspace = true }

# The fingerprint's hash, in the build script only: it runs on the host, never
# links into the artifact, and leaves `no_std` and the one-dependency rule above
# intact. Same primitive as every other hash in the engine (§4.2.1).
[build-dependencies]
blake3 = { workspace = true }

[lints]
workspace = true
