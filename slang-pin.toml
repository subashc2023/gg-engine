# Pinned Slang compiler version, per host (§4.4, §8).
#
# Why this file exists. The `shader-slang` crate does *not* pin Slang. Its
# `-sys` crate runs bindgen against whatever `slang.h` the build machine has
# (SLANG_INCLUDE_DIR -> $SLANG_DIR/include -> $VULKAN_SDK/include/slang) and
# emits `cargo:rustc-link-lib=dylib=slang`, so the compiler that reflects our
# shaders and emits our SPIR-V is a property of the *machine*, invisible to
# Cargo.lock. Meanwhile `xtask shaders --check` requires the generated Rust to
# be byte-identical on every host, because layout facts are the cross-host
# truth (the .spv blobs are deliberately excused — the two hosts genuinely ship
# different Slang builds). That gate only means something if its input is
# pinned; otherwise a Slang upgrade on one host turns gate 3 red for reasons
# nobody can attribute, or — worse — silently changes a reflected offset that
# both hosts then agree on.
#
# The values are what `slang::GlobalSession::build_tag_string()` returns at
# runtime: the dylib actually loaded, not the header compiled against. Those
# can differ, and the runtime one is what produced the artifacts.
#
# Bumping a row is a deliberate act, not maintenance: install the new SDK/Slang,
# re-run `cargo xtask shaders`, and *read the diff*. An empty diff means the
# upgrade was layout-neutral and the row may move. A non-empty diff in the
# generated `.rs` means reflection changed under you, which is a codegen
# compatibility event — check that every offset still matches the shader's
# intent before blessing it.
#
# The two rows differ today because the hosts are provisioned differently: the
# Windows lane takes Slang from the LunarG Vulkan SDK (§9), the WSL lane from a
# standalone SLANG_DIR. Converging them is desirable but not required — what is
# required is that neither drifts unnoticed.
#
# The key is `std::env::consts::OS`, so a third host is a third row and its
# absence is refused by name. `macos` has none yet: the row is written when a
# Mac first runs `cargo xtask shaders` and the generated diff has been read,
# never guessed ahead of the machine.

[hosts]
windows = "2025.23.2"
linux = "2026.14.1"
