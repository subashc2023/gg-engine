# Determinism mechanism (§3, §4.2.1 hazard 3): randomly-seeded hash iteration
# order is a likelier divergence source than floats. Sim state uses IndexMap
# with a fixed hasher, sorted Vecs, or dense archetype iteration (gg-ecs).
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is randomly seeded; use IndexMap/sorted Vec/dense iteration — PLAN.md §4.2.1 hazard 3" },
    { path = "std::collections::HashSet", reason = "iteration order is randomly seeded; use IndexSet/sorted Vec/dense iteration — PLAN.md §4.2.1 hazard 3" },
]
