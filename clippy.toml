# Determinism mechanism (§3, §4.2.1 hazard 1): std float transcendentals are not
# correctly rounded by IEEE 754 and differ between MSVC's CRT, glibc, musl, and
# glibc versions. Sim code takes them from the `libm` crate via gg_math::sim (M0B).
# The lists apply workspace-wide (stricter than §3 requires): render-side code
# that legitimately needs an entry allows it at the use site with a reason, so
# the deterministic choice is the default one. gg_math::sim itself calls libm
# directly, which these bans never touch.
disallowed-methods = [
    { path = "f32::sin", reason = "not correctly rounded; use gg_math::sim (libm) — PLAN.md §4.2.1" },
    { path = "f32::cos", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::sin_cos", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::tan", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::asin", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::acos", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::atan", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::atan2", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::sinh", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::cosh", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::tanh", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::exp", reason = "not correctly rounded; use gg_math::sim (libm)" },
    { path = "f32::exp2", reason = "not correctly rounded; use gg_math::sim (libm)" },
