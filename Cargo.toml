# Golden Game Engine workspace. PLAN.md §3 is the authority on layout, lints,
# profiles, and tier features; §6 headings are the milestone ledger.

[workspace]
resolver = "3"
members = ["crates/gg-math", "crates/gg-runtime", "crates/gg-shaders", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
# Rented layers (§2, Locked Decisions).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
profiling = "1"
tracy-client = "0.18"
tracing-tracy = "0.11"
thiserror = "2"
anyhow = "1"
shader-slang = "0.1"
ash = "0.38"
# gg-math (§4.2.1): portable transcendentals for sim, SIMD glam for render,
# Pod for hashed/flat state. libm bumps are Determinism Contract events.
libm = "0.2"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"

[workspace.lints.clippy]
# Error-handling policy (§2): unwrap/expect forbidden in engine crates. Tools and
# xtask do not inherit workspace lints; tests carry an explicit #[allow].
unwrap_used = "deny"
expect_used = "deny"
# Determinism mechanisms (§3): the method and type lists live in clippy.toml.
# Workspace-wide, deliberately stricter than §3 requires: a render-side crate
# that legitimately wants a HashMap allows it at the use site with a reason,
# so the safe state is the default state.
disallowed_methods = "deny"
disallowed_types = "deny"

# `#![deny(warnings)]` is CI-only (§3): xtask ci passes -D warnings; local builds warn.

[profile.dev]
opt-level = 1              # debug builds must hit interactive framerates
[profile.dev.package."*"]
opt-level = 3              # dependencies always optimized

[profile.instrumented]     # the profiling build: real codegen, zones still in
inherits = "release"
debug = true               # Tracy and crash dumps need symbols
lto = "thin"

[profile.dist]             # the shipping build
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"          # split-debug artifact archived per release, not shipped

[profile.bench]
inherits = "instrumented"
