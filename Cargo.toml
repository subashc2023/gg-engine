# Golden Game Engine workspace. PLAN.md §3 is the authority on layout, lints,
# profiles, and tier features; §6 headings are the milestone ledger.

[workspace]
resolver = "3"
members = [
    "crates/gg-abi",
    "crates/gg-assets",
    "crates/gg-core",
    "crates/gg-debug",
    "crates/gg-ecs",
    "crates/gg-ecs-derive",
    "crates/gg-extract",
    "crates/gg-input",
    "crates/gg-math",
    "crates/gg-platform",
    "crates/gg-render",
    "crates/gg-rhi",
    "crates/gg-runtime",
    "crates/gg-scene",
    "crates/gg-shaders",
    "demos/00-clear",
    "demos/01-triangle",
    "demos/02-mesh",
    "demos/03-reload",
    "demos/04-scene",
    "demos/05-many",
    "demos/06-lit",
    "demos/99-template",
    "tools/gg-golden",
    "tools/gg-static-link",
    "tools/ggc",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
# Unpublished by design (§7): the engine ships as a product, not a registry
# crate — and cargo-deny's path-wildcard allowance keys off this.
publish = false

[workspace.dependencies]
# Rented layers (§2, Locked Decisions).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
profiling = "1"
# Version-coupled to the Tracy profiler GUI by wire protocol, so the patch is
# pinned rather than carets: 0.18.0..=0.18.4 span Tracy v0.11.1..=v0.13.1 and a
# mismatch is a hard connect failure, not a degradation. Requires Tracy v0.13.1.
#
# `only-localhost` is the third firewall-prompt cause, and the only one left that
# is ours. Measured: a tracy-linked binary opens a TCP listener on *all*
# interfaces from a static constructor, before `main`, with no profiler attached;
# the same shell built without tracy opens no socket at all. Windows raises its
# dialog per executable that binds a non-loopback *listener*, and nextest names
# test binaries with a build hash, so every rebuild was a fresh prompt. The
# feature moves the listener to 127.0.0.1, which the firewall never asks about;
# the profiler still attaches, because it runs on this machine. On both
# declarations because cargo unions features — one of them alone is a coin toss
# over which crate the resolver reaches first.
#
# Tracy's UDP broadcast socket stays, and is not worth chasing: `profiling`
# declares `tracy-client` without `default-features = false`, so `broadcast`
# re-enters through `profile-with-tracy` and features cannot be subtracted. It
# does not prompt — its port is ephemeral and different every run (61230, 61231,
# 52476…), which is a sender, not a listener.
tracy-client = { version = "=0.18.4", features = ["only-localhost"] }
tracing-tracy = { version = "0.11", features = ["only-localhost"] }
thiserror = "2"
anyhow = "1"
shader-slang = "0.1"
ash = "0.38"
# gg-math (§4.2.1): portable transcendentals for sim, SIMD glam for render,
# Pod for hashed/flat state. libm bumps are Determinism Contract events — and
# that is why this is an *exact* pin, not a caret: libm's own patch releases
# move result bits (0.2.12 replaced cbrt wholesale with CORE-MATH, 0.2.16 fixed
# the expm1f overflow threshold — both functions gg_math::sim exposes and the FP
# baseline pins). A caret would let `cargo update` perform a contract event
# silently, with Cargo.lock as the only thing standing in the way.
libm = "=0.2.16"
bytemuck = { version = "1", features = ["derive"] }
# M3 (§4.2, §4.2.1): the one hash primitive behind component ids, schema hashes
# and the canonical state hash. Exact-pinned like libm, but for a different
# reason — blake3's output is a frozen published spec, so a patch release cannot
# move result bits the way libm's can; the pin guards the crate's *API*, and the
# spec guards the numbers. `pure` forces the portable backend: spec says every
# backend agrees, but runtime CPUID dispatch inside the determinism path is the
# exact shape §4.2.1 hazard 1 refuses for libm's fma, so it stays out.
blake3 = { version = "=1.8.5", default-features = false, features = ["pure"] }
# gg-ecs-derive's build-time trio. Never in a runtime dependency graph.
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
# Compile-fail harness for the M3 derive rejections. Dev-dependency only.
trybuild = "1"
# Render-side only, and deny.toml keeps it that way; judged by gg-golden, never
# by a hash. Never enable `fast-math` — it is the one glam feature that would
# disturb blessed golden images.
glam = "0.33"
# M1 (§4.3, §2): windowing rented behind gg-platform; ash-window/gpu-allocator
# are gg-rhi's surface + memory plumbing (deny.toml wrappers cover their ash).
# csd-adwaita-notitle: Wayland decorations without titlebar text — drops the
# ab_glyph/ttf-parser font stack. The advisory is on ttf-parser specifically
# (RUSTSEC-2026-0192, unmaintained, 2026-06-29, no patched version — upstream
# points at skrifa); ab_glyph is how winit reaches it. Verified absent from
# Cargo.lock. This exemption holds only while sctk-adwaita keeps its font
# backends optional: `-notitle` enables it with no font backend at all.
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
] }
raw-window-handle = "0.6"
# §4.1: work-stealing is banned near the state hash and allowed downstream of
# it. deny.toml holds the ban and determinism-allowlist.toml the exemptions.
rayon = "1"
# M9 (§4.6), the pack's *runtime* side and therefore the only two of this group
# that may reach a shipping graph: `memmap2` maps a pack so its sections are
# cast in place rather than deserialized, and `zstd` is the codec a KTX2 level
# is a frame of — the one blob that is decompressed instead of pointed at.
memmap2 = "0.9"
zstd = "0.13"
# `ggc`'s side of §4.6 — the importer and the codecs. None of these may appear
# in a dist graph and the dist gate proves it by name, which is why the tool is
# a separate crate rather than a feature of the runtime one. xxhash3 gates the
# incremental cache; it never crosses the determinism membrane (§4.1), so it is
# deliberately not blake3.
# `default-features = false`: the default `random` feature pulls `rand` in to
# seed a hasher, and a *content* hash that took a random seed would defeat the
# incremental cache it exists to key.
twox-hash = { version = "2", default-features = false, features = [
    "std",
    "xxhash3_64",
] }
gltf = "1.4"
# Only the two codecs glTF actually carries. The rest of `image`'s format list
# is build time spent on formats a source tree cannot contain.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
intel_tex_2 = "0.5"
ash-window = "0.13"
# 0.28 gained no_std support, which moved `std` into `default` — so with
# default-features = false the `std` feature must be named explicitly or the
# crate hits its own `compile_error!` demanding std-or-hashbrown.
gpu-allocator = { version = "0.28", default-features = false, features = [
    "std",
    "vulkan",
] }
# M5 (§4.2.2): the game dylib's loader. Unconditional — dist loads the table
# once too, and the only difference between the tiers is who watches for a new
# one. `dlopen`/`LoadLibrary` behind a safe-ish wrapper is the whole of it; the
# unsafety that matters is the symbol signatures, which are ours.
libloading = "0.8"
# M2 (§4.4, §4.10): notify drives shader hot reload (dev-only — the dist gate
# proves its absence); png is gg-golden's reference-image format.
notify = "8"
png = "0.18"
# gg-platform's Win32 half of the §1.5 window law (WS_EX_TOOLWINDOW/NOACTIVATE,
# GetWindowRect). Declared here rather than in the crate so both its normal and
# dev dependency stay in lockstep.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.clippy]
# Error-handling policy (§2): unwrap/expect forbidden in engine crates. Tools and
# xtask do not inherit workspace lints; tests carry an explicit #[allow].
unwrap_used = "deny"
expect_used = "deny"
# Determinism mechanisms (§3): the method and type lists live in clippy.toml.
# Workspace-wide, deliberately stricter than §3 requires: a render-side crate
# that legitimately wants a HashMap allows it at the use site with a reason,
# so the safe state is the default state.
disallowed_methods = "deny"
disallowed_types = "deny"

# `#![deny(warnings)]` is CI-only (§3): xtask ci passes -D warnings; local builds warn.

[profile.dev]
opt-level = 1              # debug builds must hit interactive framerates
[profile.dev.package."*"]
opt-level = 3              # dependencies always optimized

[profile.instrumented]     # the profiling build: real codegen, zones still in
inherits = "release"
debug = true               # Tracy and crash dumps need symbols
lto = "thin"

[profile.dist]             # the shipping build
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"          # split-debug artifact archived per release, not shipped
# `strip` with nothing to strip archives nothing: without these two the dist
# build emits no debug info at all and §3's "archived per release" names a file
# that never existed. `1` is names + line tables — what symbolizing a crash
# report needs; full types are what a *debugger* wants and cost artifact size
# nobody reads. `packed` is the PDB on MSVC and the `.dwp` on ELF; the shipped
# bytes are unchanged either way, which is what makes this free (§6 M8).
debug = 1
split-debuginfo = "packed"

[profile.bench]
inherits = "instrumented"
