# `cargo xtask` — the only runner §9 guarantees on both OSes (§6 M0A).
[alias]
xtask = "run --quiet --package xtask --"

# The dev machine is also the user's gaming PC (§1.5), and five *implicit* Vulkan
# layers are installed on it — Steam's overlay and Fossilize, Epic's overlay,
# OBS's capture hook, RenderDoc. The loader injects an implicit layer into every
# process that creates an instance, with no opt-in from us, which means:
#
#   - two of them open sockets, so Windows Firewall prompts once per *binary
#     path* — and nextest names test binaries with a build hash, so every rebuild
#     is a new path and a fresh prompt at the user's desk;
#   - they sit in the presentation and pipeline-creation path of every golden
#     image (§4.10) and every `xtask bench` number (§4.11). A per-pixel gate and
#     an archived frame time should be measuring this engine, not this engine
#     plus whatever Steam shipped last Tuesday.
#
# `~implicit~` is the loader's own category token (1.3.234+); an older loader
# ignores the variable rather than failing. Explicit layers are untouched, so
# gg-rhi's validation layer in the dev tier still loads. `gg-golden capture` is
# unaffected: RenderDoc launches that process itself, not through cargo (§4.8).
[env]
VK_LOADER_LAYERS_DISABLE = "~implicit~"

# The third architecture of the §5 execution matrix: aarch64 under qemu-user,
# run from WSL in the nightly tier (§6 M0B). qemu-user is how cross-rs tests
# ARM without ARM hardware; qemu-not-silicon is a named §8 residual.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
runner = ["qemu-aarch64", "-L", "/usr/aarch64-linux-gnu"]
