# demo 00-clear (§6 M1): animated clear color, resize-stable. Demos 00–02 are
# their own thin mains until the systems table exists (§2 Game-code boundary);
# demos never rot — this compiles and runs in CI forever.

[package]
name = "demo-00-clear"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gg-math = { path = "../../crates/gg-math" }
gg-platform = { path = "../../crates/gg-platform" }
gg-rhi = { path = "../../crates/gg-rhi", default-features = false }

[features]
# Mirrors gg-runtime's tier discipline (§3): named combinations only.
default = ["tier-dev"]
validation = ["gg-rhi/validation"]
fp-assert = []
tier-dev = ["validation", "fp-assert"]
tier-dist = []
