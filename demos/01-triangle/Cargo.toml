# demo 01-triangle (§6 M2): the Golden Triangle, hot-reloadable color. The
# scene lives in the lib target so gg-golden renders exactly what the demo
# renders; the windowed app rides behind the `app` feature so the harness's
# dependency graph never touches gg-platform/winit (§5 gate 7).

[package]
name = "demo-01-triangle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "demo-01-triangle"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
bytemuck.workspace = true
gg-rhi = { path = "../../crates/gg-rhi", default-features = false }
# The render graph: this demo declares one pass and writes no barrier (§4.5).
gg-render = { path = "../../crates/gg-render", default-features = false }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
gg-math = { path = "../../crates/gg-math", optional = true }
gg-platform = { path = "../../crates/gg-platform", optional = true }
gg-shaders = { path = "../../crates/gg-shaders", features = ["hot-reload"], optional = true }

[features]
# Mirrors gg-runtime's tier discipline (§3): named combinations only.
default = ["app", "tier-dev"]
# The windowed demo binary. gg-golden depends on this crate with
# default-features = false: scene only, no windowing in its graph.
app = [
    "dep:gg-platform",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:gg-math",
]
validation = ["gg-rhi/validation"]
fp-assert = []
hot-reload = ["dep:gg-shaders"]
tier-dev = ["validation", "fp-assert", "hot-reload"]
tier-dist = ["app"]
