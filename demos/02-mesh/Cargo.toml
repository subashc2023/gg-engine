# demo 02-mesh (§6 M4A): a textured spinning mesh under a fly camera. Same
# lib/bin split as demo 01 — the lib is the *scene* (mesh, texture, camera,
# push constants) so gg-golden renders exactly what the demo renders, and the
# windowed app rides the `app` feature so the harness's dependency graph never
# touches gg-platform/winit (§5 gate 7).

[package]
name = "demo-02-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "demo-02-mesh"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
bytemuck.workspace = true
gg-math = { path = "../../crates/gg-math" }
gg-rhi = { path = "../../crates/gg-rhi", default-features = false }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
gg-platform = { path = "../../crates/gg-platform", optional = true }

[features]
# Mirrors gg-runtime's tier discipline (§3): named combinations only.
default = ["app", "tier-dev"]
# The windowed demo binary. gg-golden depends on this crate with
# default-features = false: scene only, no windowing in its graph.
app = [
    "dep:gg-platform",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
]
validation = ["gg-rhi/validation"]
fp-assert = []
tier-dev = ["validation", "fp-assert"]
tier-dist = ["app"]
