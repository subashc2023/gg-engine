# Demo 10's bindings (§4.7). By *physical* key position, so this file means the
# same thing on AZERTY as on QWERTY.
#
# Verb names resolve against the two lists in `gg_game!`, and their order there
# is the id space a replay records — so renaming a verb here without renaming it
# there is refused at load, not silently dead.
#
# One hand on the left cluster: WASD moves and drops, Q/E rotate, and the thumb
# key is hold. The arrow cluster doubles the four WASD verbs — including Up as
# *hard drop* rather than rotate, because a scheme where W and Up disagree is
# worse than one that departs from the arcade default.

[game.actions]
left = ["A", "Left"]
right = ["D", "Right"]
soft_drop = ["S", "Down"]
hard_drop = ["W", "Up"]
rotate_cw = ["E"]
rotate_ccw = ["Q"]
hold = ["Space"]
restart = ["R"]
pause = ["P"]
ui_click = ["Mouse1"]
ui_focus = ["Tab"]
# The keyboard's half of a click (§6 M74). Tab has always moved the focus ring
# and nothing could press what it landed on, so every settings row, QUIT TO
# TITLE and EXIT wanted a mouse. Enter alone rather than Enter and Space: Space
# is `hold`, and a verb sharing a key with a gameplay one is a decision that has
# to be right in both directions rather than convenient in one.
ui_press = ["Enter"]
# Claimed from the shell, which quits on an unclaimed Escape without the game
# ever hearing it (§6 M44) — the one key a game has to take to own its own exit.
back = ["Escape"]

# The steered pointer (§4.9, §6 M19): the menus are clicked with the arrow the
# operator sees, so these are `PointerX`/`PointerY` — never raw `MouseX` counts.
[game.axes]
ui_x = ["PointerX"]
ui_y = ["PointerY"]

# What still reaches the game while a menu is up (§6 M45). The game raises
# `Prefs::modal`; the host then withholds every verb this list does not name, so
# no system has to ask which screen it is on. The seven here are the ones a menu
# *is*: the pointer that clicks it, the click, the focus key, the two verbs that
# open and leave it, and `restart` — which is START on the title screen and so
# the key that begins the game. Leaving `restart` out is what `xtask reload
# --menu` caught, and it reads exactly like a misplaced click: the tour reached
# six of ten milestones because PLAY on the keyboard did nothing. A `left`
# delivered behind the pause plate, by contrast, would slide a piece nobody can
# see moving, which is why it is not here.
[game.modal]
keep = ["pause", "back", "restart", "ui_click", "ui_focus", "ui_press", "ui_x", "ui_y"]
