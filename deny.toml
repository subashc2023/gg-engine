# cargo-deny: licenses, advisories, duplicate deps, and the §3 ban mechanisms.
# Live from the first commit, before the crates they contain even exist (§6 M0A).
# The gg-runtime *dist-graph* bans (no tools/harness/notify/Tracy in what ships)
# are enforced by the dist gate in `xtask dist` (§5.8), which resolves the exact
# tier-dist feature set — a per-feature-set graph cargo-deny does not model.

[graph]
# Default features only: the ban rules below are feature-independent, and the four
# named tier combinations are built (not powerset-tested) by CI (§3, §5.8).
all-features = false

[licenses]
# §2, License row: no copyleft surprises in the tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies (crates/ ↔ demos/) carry no version — the
# workspace is unpublished by design (§7). Registry wildcards stay banned.
allow-wildcard-paths = true
deny = [
    # API containment (§3): ash appears in exactly one engine crate — gg-rhi.
    # xtask is a tool outside the seam; its `probe` (spike 2, §6 M0A) queries
    # device capabilities directly. ash-window and gpu-allocator are gg-rhi's
    # own plumbing (surface creation, GPU memory — §2/§4.3) and appear in no
    # other crate's graph. The companion grep in `xtask ci` rejects
    # vk::/ash:: tokens in every other crate's source.
    { crate = "ash", wrappers = ["gg-rhi", "xtask", "ash-window", "gpu-allocator"] },
    # Determinism (§3): sim crates never see glam. gg-math wraps it as
    # gg_math::render, and that is the *only* edge — gg-extract is the membrane
    # crate allowed both sides but reaches render through gg-math like everyone
    # else, so listing it here was a wrapper for an edge that does not exist and
    # cargo-deny said so on every push (§6 M5 finding).
    { crate = "glam", wrappers = ["gg-math"] },
    # Determinism (§4.1): no work-stealing near the state hash. Exemptions only
    # via determinism-allowlist.toml; this wrappers list must mirror that file
    # plus the render/tools crates rayon is chartered for — xtask ci cross-checks.
    { crate = "rayon", wrappers = ["gg-extract"] },
    # UI containment (§4.9, §6 M13's exit row, §6 M15's second): `egui` is
    # permitted in tools and in no engine crate — it draws outside our
    # render graph and therefore outside `gg-golden`, which is a permanent hole
    # in the best quality gate we have, in the subsystem where regressions are
    # subtlest. The wrappers list is **empty and armed**: nothing depends on it
    # today, so the first crate that does gets a review rather than a green run
    # (the validation-suppressions rule, applied to a dependency). M15 built the
    # editor and the list is still empty, which is what "every panel is `gg-ui`"
    # means as a machine: the dogfooding is not a policy, it is that there is no
    # other option in the tree.
    { crate = "egui", wrappers = [] },
]
